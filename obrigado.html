<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro realizado - UFODROMO</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #080b12;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;

            padding: 40px 25px;
        }

        h1 {
            margin-bottom: 20px;

            color: #55e5b0;

            font-size: 32px;
        }

        p {
            margin: 12px 0;

            color: #d5d5d5;

            font-size: 18px;

            line-height: 1.6;
        }

        .whatsapp-button {
            display: inline-block;

            margin-top: 30px;

            padding: 16px 30px;

            background: #25D366;

            color: #ffffff;

            text-decoration: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            transition: 0.2s;
        }

        .whatsapp-button:hover {
            transform: translateY(-2px);

            opacity: 0.9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Cadastro realizado com sucesso!
        </h1>

        <p>
            Obrigado por demonstrar interesse no
            <strong>UFODROMO</strong>.
        </p>

        <p>
            Para acompanhar as novidades, receber atualizações
            e ficar por dentro das próximas novidades,
            siga nosso canal oficial no WhatsApp.
        </p>

        <a
            class="whatsapp-button"
            href="COLOQUE_AQUI_O_LINK_DO_SEU_CANAL"
            target="_blank"
            rel="noopener noreferrer"
        >
            📱 Seguir canal no WhatsApp
        </a>

    </div>

</body>

</html>
